<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Safety Monitor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<main class="page-wrap">
  <div class="container py-4">
    <div class="form-shell">
      <div class="card-lite p-4">
        <h3 class="fw-bold mb-1">Login</h3>
        <p class="text-muted mb-3">Access your role dashboard (Worker / Engineer / Management).</p>

        <form method="post" action="/login" class="d-grid gap-3">
          <div>
            <label class="form-label">Email</label>
            <input class="form-control input-soft" type="text" name="username" required>
          </div>

          <div>
            <label class="form-label">Password</label>
            <input class="form-control input-soft" type="password" name="password" required>
          </div>

          <button class="btn btn-primary py-2" type="submit">Login</button>
        </form>

        <div class="text-muted small mt-3">
          New user? <a href="/register">Create account</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
