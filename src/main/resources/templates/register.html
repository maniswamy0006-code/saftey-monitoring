<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Safety Monitor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<main class="page-wrap">
  <div class="container py-4">
    <div class="form-shell">
      <div class="card-lite p-4">
        <h3 class="fw-bold mb-1">Create Account</h3>
        <p class="text-muted mb-3">Register and select your interface role.</p>

        <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

        <form method="post" action="/register" class="row g-3">
          <div class="col-12">
            <label class="form-label">Full Name</label>
            <input class="form-control input-soft" type="text" name="fullName" required>
          </div>

          <div class="col-12">
            <label class="form-label">Email</label>
            <input class="form-control input-soft" type="email" name="email" required>
          </div>

          <div class="col-12">
            <label class="form-label">Password</label>
            <input class="form-control input-soft" type="password" name="password" required>
          </div>

          <div class="col-12">
            <label class="form-label">Role</label>
            <select class="form-select input-soft" name="role" required>
              <option value="ROLE_WORKER">Worker</option>
              <option value="ROLE_ENGINEER">Engineer</option>
              <option value="ROLE_MANAGEMENT">Management</option>
            </select>
          </div>

          <div class="col-12 d-grid">
            <button class="btn btn-primary py-2" type="submit">Register</button>
          </div>
        </form>

        <div class="text-muted small mt-3">
          Already registered? <a href="/login">Login</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
